name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          token: ${{ secrets.GH_PERSONAL_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Lint JS
        run: pnpm lint:js

  lint-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          token: ${{ secrets.GH_PERSONAL_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Lint Style
        run: pnpm lint:style

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          token: ${{ secrets.GH_PERSONAL_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: pnpm typeCheck

  test:
    runs-on: ubuntu-latest
    # Prisma 経路のテストは実 DB を通すので、本番ではなく使い捨ての Postgres へ向ける
    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/attt_test
      TEST_DATABASE_URL: postgresql://root:root@localhost:5432/attt_test
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: attt_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          TZ: 'Asia/Tokyo'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          token: ${{ secrets.GH_PERSONAL_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          database_url: postgresql://root:root@localhost:5432/attt_test

      - name: Migrate database
        run: pnpm prisma migrate deploy

      - name: Test
        run: pnpm test

  ci:
    if: ${{ always() }}
    needs: [lint-js, lint-style, type-check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          test "${{ needs.lint-js.result }}" = "success"
          test "${{ needs.lint-style.result }}" = "success"
          test "${{ needs.type-check.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
